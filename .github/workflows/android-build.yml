name: Android Build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '*.zip'
      - 'README.md'
      - 'README_*.txt'
  workflow_run:
    workflows: ['Unpack ZIP']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project layout
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts
          test -f scripts/validate_source.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Read version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Validate source
        run: python3 scripts/validate_source.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          if find app/src/main/assets -type f -name '*.js' -print -quit | grep -q .; then
            while IFS= read -r -d '' file; do node --check "$file"; done < <(find app/src/main/assets -type f -name '*.js' -print0)
          fi

      - name: Configure stable signing if all secrets exist
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.JABRA_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.JABRA_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.JABRA_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.JABRA_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          for value in "$SIGNING_KEYSTORE_BASE64" "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -ne 0 ] && [ "$present" -ne 4 ]; then
            echo 'ERROR: Signing secrets are partially configured. Set all four or remove all four.'
            exit 1
          fi
          if [ "$present" -eq 4 ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/jabra-release.p12"
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "JABRA_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "JABRA_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "JABRA_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "JABRA_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'BUILD_VARIANT=release' >> "$GITHUB_ENV"
            echo "APK_FILENAME=Jabra-Extension-Hub-v${VERSION_NAME}.apk" >> "$GITHUB_ENV"
            echo 'Stable release signing configured.'
          else
            echo 'BUILD_VARIANT=debug' >> "$GITHUB_ENV"
            echo "APK_FILENAME=Jabra-Extension-Hub-v${VERSION_NAME}-debug.apk" >> "$GITHUB_ENV"
            echo 'WARNING: No stable signing secrets configured. Building a temporary debug APK; it may not update an already installed copy.'
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_VARIANT" = 'release' ]; then
            gradle assembleRelease
            APK_PATH="app/build/outputs/apk/release/$APK_FILENAME"
            cp app/build/outputs/apk/release/app-release.apk "$APK_PATH"
          else
            gradle assembleDebug
            APK_PATH="app/build/outputs/apk/debug/$APK_FILENAME"
            cp app/build/outputs/apk/debug/app-debug.apk "$APK_PATH"
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILENAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish release for in-app updates
        if: env.BUILD_VARIANT == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export TAG="v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}"
          cp "$APK_PATH" Jabra-Extension-Hub.apk
          python3 - <<'PY'
          import hashlib, json, os, re
          ver = os.environ['VERSION_NAME']
          gradle = open('app/build.gradle.kts', encoding='utf-8').read()
          code = int(re.search(r'versionCode\s*=\s*(\d+)', gradle).group(1))
          sha = hashlib.sha256(open('Jabra-Extension-Hub.apk', 'rb').read()).hexdigest()
          notes_file = 'README_JABRA_V%s.txt' % ver
          notes = open(notes_file, encoding='utf-8').read().strip()[:900] if os.path.exists(notes_file) else 'New version.'
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['TAG']
          json.dump({
              'versionCode': code,
              'versionName': ver,
              'sha256': sha,
              'apkUrl': 'https://github.com/%s/releases/download/%s/Jabra-Extension-Hub.apk' % (repo, tag),
              'notes': notes,
          }, open('app-update.json', 'w', encoding='utf-8'), indent=2)
          open('release-notes.txt', 'w', encoding='utf-8').write(notes)
          PY
          gh release create "$TAG" Jabra-Extension-Hub.apk app-update.json \
            --title "Jabra Extension Hub v${VERSION_NAME}" --notes-file release-notes.txt
